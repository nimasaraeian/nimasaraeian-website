>$('#toast').classList.add('hide'),1900)}function head(t,s=''){return `<div class="head"><h2>${t}</h2><small>${s}</small></div>`}function card(x,c=''){return `<section class="card ${c}">${x}</section>`}function metric(t,v,w){return `<section class="card metric"><span>${t}</span><b>${v}</b><div class="bar"><i style="width:${Math.min(100,w)}%"></i></div></section>`}function project(p){return `<div class="project"><div class="ptop"><div class="logo ${p.c}">${p.l}</div><div class="copy"><b>${p.n}</b><span>${p.s}</span></div><div class="pct">${fa(p.v)}%</div></div><div class="bar"><i style="width:${p.v}%"></i></div></div>`}function taskRows(all=true){let a=all?S.tasks:S.tasks.filter(x=>!x.d).slice(0,3);return a.map((x,i)=>`<div class="row"><button class="check ${x.d?'on':''}" data-task="${x.id}">✓</button><div class="copy"><b style="${x.d?'text-decoration:line-through;color:var(--m)':''}">${esc(x.t)}</b><span>${esc(x.m)}</span></div>${!all?`<div class="num">${fa(i+1)}</div>`:''}</div>`).join('')}function today(){return `<div class="stack">${card(`<small>${new Intl.DateTimeFormat('fa-IR',{weekday:'long',month:'long',day:'numeric'}).format(new Date())}</small><h1>سلام نیما 👋</h1><p>امروز لازم نیست همه‌چیز را حل کنی. یک تصمیم روشن، یک کار عمیق و کمی مراقبت از بدن کافی است.</p><div class="cap"><div><small>ظرفیت واقعی امروز</small><b>۶۷٪</b></div><div class="ring"><span>متعادل</span></div></div>`,'hero')}${card(`${head('سه اولویت امروز',S.tasks.filter(x=>!x.d).length+' کار باز')}<div class="list">${taskRows(false)}</div>`)}${card(`<div class="aihead"><div class="orb"></div><div class="copy"><b>پیشنهاد Nima AI</b><span>بر اساس برنامه و انرژی امروز</span></div></div><p>ابتدا ارتباطات کاری را ببند. بعد از ناهار فقط روی یک تصمیم محصول تمرکز کن و پیاده‌روی را حذف نکن.</p><button class="btn soft" data-chat>گفت‌وگو با دستیار</button>`,'ai')}${card(`${head('برنامه امروز')}<div class="list">${S.schedule.map(x=>`<div class="row"><div class="num" style="width:52px;direction:ltr">${x[0]} (e){toast(e.message)}finally{b.disabled=false;b.textContent='ورود به مرکز فرمان'}};$('#token').value=localStorage.getItem(TK)||'';$('#token').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};$('#profile').onclick=()=>toast('اتصال‌ها: Gmail، Calendar، Notion و GitHub در مرحله بعد');$('#bell').onclick=()=>toast(S.approvals.filter(x=>x.st==='pending').length+' پیشنهاد منتظر تأیید توست');</script></body></html>
